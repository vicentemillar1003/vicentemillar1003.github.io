<style>
:root{
  --bg:#0b0f14; --card:#111821; --text:#d6e2f0; --muted:#7d8ea3; --line:#1e2a38;
  --accent:#3ddc97; --accent2:#4cc9f0; --boson:#ff7a7a; --quark:#b69cff; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f6f9; --card:#ffffff; --text:#17202b; --muted:#5d6b7c; --line:#dbe2ea;
  --accent:#0a9e68; --accent2:#0a7ea8; --boson:#d64545; --quark:#7050d8; --shadow:0 10px 30px rgba(20,30,50,.08); color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:15px;background:var(--bg);color:var(--text);line-height:1.7;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;opacity:.35;mask-image:radial-gradient(ellipse at 50% 20%,#000 0,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 0,transparent 75%)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
section{padding:78px 0}
h2{font-size:clamp(1.4rem,3.5vw,1.9rem);margin-bottom:4px}
h2 .pre{color:var(--accent)}
.sub{color:var(--muted);margin-bottom:34px}
.sub::before{content:"// ";color:var(--accent)}
.grad{background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}

nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-weight:700}.logo b{color:var(--accent)}
.links{display:flex;gap:20px}
.links a{color:var(--muted);font-size:.85rem;transition:color .2s}
.links a:hover{color:var(--accent)}
.icon-btn{min-width:36px;height:36px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:.8rem;font-weight:700}
.icon-btn:hover{border-color:var(--accent)}
#burger{display:none}
@media(max-width:900px){
  #burger{display:inline-block}
  .links{position:absolute;top:58px;left:0;right:0;flex-direction:column;gap:0;background:var(--card);border-bottom:1px solid var(--line);max-height:0;overflow:hidden;transition:max-height .3s}
  .links.open{max-height:420px}.links a{padding:13px 20px}
}

#hero{position:relative;min-height:90vh;display:flex;align-items:center;padding:50px 0;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#evt{position:absolute;left:20px;bottom:14px;z-index:1;color:var(--muted);font-size:.72rem}
#hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
@media(max-width:860px){#hero .wrap{grid-template-columns:1fr}}
.who{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.avatar{width:68px;height:68px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-weight:700;font-size:1.2rem;color:var(--accent);background:var(--card);position:relative;overflow:hidden;flex:none}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.open{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;padding:4px 12px;border:1px solid var(--accent);border-radius:99px;color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.open i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.hello{color:var(--accent);margin-bottom:6px}
h1{font-size:clamp(2rem,6.5vw,3.4rem);line-height:1.1;margin-bottom:12px}
.role{color:var(--muted)}
.bio{color:var(--muted);max-width:520px;margin:14px 0 26px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:11px 20px;border-radius:8px;font-weight:500;border:1px solid var(--line);background:var(--card);transition:transform .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#04120b;border-color:var(--accent);font-weight:700}
.term{background:#0a0d12;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;color:#d6e2f0}
.term .bar{display:flex;gap:7px;padding:11px 14px;background:#131a24;border-bottom:1px solid #1e2a38}
.term .bar i{width:11px;height:11px;border-radius:50%;background:#ff5f56}.term .bar i:nth-child(2){background:#ffbd2e}.term .bar i:nth-child(3){background:#27c93f}
#term{padding:16px 18px;min-height:250px;font-size:.88rem}
.ps{color:#3ddc97}.out{color:#8fa3ba;margin:0 0 8px 16px}
.cursor{display:inline-block;width:8px;height:1em;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Standard Model style tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tile{--c:var(--accent);position:relative;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:12px 16px 18px;text-align:center;transition:transform .25s,box-shadow .25s}
.tile:hover{transform:translateY(-4px);box-shadow:0 0 24px color-mix(in srgb,var(--c) 25%,transparent)}
.k-quark{--c:var(--quark)}.k-boson{--c:var(--boson)}
.tm{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted)}
.sym{font-size:2.6rem;font-weight:700;color:var(--c);line-height:1.3}
.tile b{display:block;font-size:2rem;line-height:1.2}
.tile .lbl{color:var(--muted);font-size:.8rem;display:block;margin-top:2px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-size:.82rem;color:var(--muted);transition:.2s}
.chip.on,.chip:hover{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:var(--shadow)}
.card.star{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.thumb{position:relative;height:150px;color:var(--accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--card)),var(--card));border-bottom:1px solid var(--line);overflow:hidden}
.thumb svg,.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:10px;top:10px;z-index:2;font-size:.72rem;padding:2px 9px;border-radius:5px;background:var(--bg);border:1px solid var(--accent);color:var(--accent)}
.body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{font-size:1rem;line-height:1.4}
.date{color:var(--accent2);font-size:.78rem}
.body p{color:var(--muted);font-size:.86rem;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.72rem;padding:2px 9px;border-radius:5px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.more{color:var(--accent);font-size:.85rem}
.note{color:var(--muted)}.hidden{display:none}
.info{display:flex;flex-direction:column;flex:1}
.gbtn{align-self:flex-start;margin-top:6px;color:var(--accent);font-size:.82rem;border:1px solid var(--line);border-radius:6px;padding:4px 12px;transition:.2s}
.gbtn:hover{border-color:var(--accent)}
.gal{display:none}
.card.open{grid-column:1/-1;flex-direction:row}
.card.open .info{width:340px;flex:none}
.card.open .gal{display:block;flex:1;border-left:1px solid var(--line);animation:gin .35s}
@keyframes gin{from{opacity:0;transform:translateY(8px)}}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:clamp(72px,13vw,140px);gap:8px;padding:16px}
.ph{position:relative;overflow:hidden;border-radius:8px;border:1px dashed var(--line);background:color-mix(in srgb,var(--accent) 5%,var(--card));display:grid;place-items:center;text-align:center;padding:6px;color:var(--muted);font-size:.68rem;line-height:1.35}
.ph:first-child{grid-column:span 2;grid-row:span 2;font-size:.8rem}
.ph span{opacity:.8}.ph em{display:block;font-style:normal}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in;transition:transform .4s}
.ph:hover img{transform:scale(1.06)}
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.88);display:none;place-items:center;cursor:zoom-out}
.lb.on{display:grid}.lb img{max-width:92vw;max-height:90vh;border-radius:8px}
@media(max-width:760px){.ph:not(:first-child) em{display:none}.mosaic{padding:12px}.card.open{flex-direction:column}.card.open .info{width:auto}.card.open .gal{border-left:0;border-top:1px solid var(--line)}}

.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px 44px}
.skill .row{display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:6px;gap:10px}
.skill .row em{color:var(--muted);font-style:normal;text-align:right}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.langs{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}
.lang{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-size:.85rem}
.lang span{color:var(--accent)}

.pub{display:flex;gap:18px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;overflow:hidden;margin-bottom:14px;font-size:.88rem}
.pub .thumb{width:190px;height:auto;min-height:130px;flex:none;border-bottom:0;border-right:1px solid var(--line)}
.pub .txt{padding:16px 18px 16px 0}
.pub small{color:var(--accent2);display:block;margin-bottom:4px}
@media(max-width:640px){.pub{flex-direction:column;gap:0}.pub .thumb{width:100%;height:120px;border-right:0;border-bottom:1px solid var(--line)}.pub .txt{padding:14px 18px}}

.list{border-left:2px solid var(--line);padding-left:22px;display:grid;gap:22px}
.item{position:relative}
.item::before{content:"";position:absolute;left:-29px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.item h3{font-size:.98rem}.item p{color:var(--muted);font-size:.86rem}

.contact{text-align:center}.contact .btns{justify-content:center}
footer{padding:28px 0;text-align:center;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.reveal.show{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let lang = null; try { lang = localStorage.getItem("lang"); } catch (e) {}
if (lang !== "es" && lang !== "en") lang = (navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en";
const L = o => (o && typeof o === "object" && !Array.isArray(o) && "en" in o) ? o[lang] : o;

/* ---------- generated illustrations (fallback when no photo) ---------- */
function arte(t){
  let s = "";
  const C = (r, o, w, d) => `<circle cx="200" cy="75" r="${r}" fill="none" stroke="currentColor" stroke-opacity="${o}" stroke-width="${w}" ${d ? `stroke-dasharray="${d}"` : ""}/>`;
  const Ln = (a, b, c, d) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="currentColor" stroke-width="2"/>`;
  if (t === "atlas"){
    s += C(8, .9, 1) + C(20, .5, 1, "2 4") + C(30, .5, 1, "2 4") + C(46, .3, 9, "7 3") + C(60, .22, 9, "10 2") + C(76, .5, 1);
    for (let i = 0; i < 14; i++){
      const a = i * .45 + .15, R = 50 + (i * 29 % 60), d = .5 + (i % 3) * .25;
      const ex = 200 + Math.cos(a + d * .5) * R * 1.6, ey = 75 + Math.sin(a + d * .5) * R;
      const cx = 200 + Math.cos(a - d * .2) * R * .88, cy = 75 + Math.sin(a - d * .2) * R * .55;
      s += `<path d="M200 75Q${cx} ${cy} ${ex} ${ey}" fill="none" stroke="currentColor" stroke-opacity=".7"/><circle cx="${ex}" cy="${ey}" r="2" fill="currentColor"/>`;
    }
    s += '<circle cx="200" cy="75" r="3" fill="currentColor"/>';
  } else if (t === "pcb"){
    ["M20 30H110V60H170", "M20 75H90V105H170", "M20 120H130V90H170", "M230 60H290V30H380", "M230 90H300V120H380", "M230 75H380"]
      .forEach(d => s += `<path d="${d}" fill="none" stroke="currentColor" stroke-opacity=".7" stroke-width="2"/>`);
    s += '<rect x="170" y="45" width="60" height="60" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>';
    [[20,30],[20,75],[20,120],[380,30],[380,75],[380,120]].forEach(([x, y]) => s += `<circle cx="${x}" cy="${y}" r="5" fill="currentColor"/>`);
  } else if (t === "mesh"){
    const P = (i, j) => [i * 25, 12 + j * 26 + 12 * Math.sin(i / 2.3 + j / 3)];
    for (let i = 0; i < 16; i++) for (let j = 0; j < 5; j++){
      const a = P(i, j), b = P(i + 1, j), c = P(i, j + 1), d = P(i + 1, j + 1);
      s += `<path d="M${a}L${b}L${d}L${c}Z M${a}L${d}" fill="none" stroke="currentColor" stroke-opacity="${(.2 + j * .13).toFixed(2)}"/>`;
    }
  } else if (t === "pulse"){
    let d = "M0 118";
    [30, 120, 215, 300].forEach((x, i) => {
      const h = 45 + (i * 17 % 40);
      d += `L${x} 118L${x + 3} ${118 - h}`;
      for (let k = 1; k <= 22; k++) d += `L${x + 3 + k * 4} ${(118 - h * Math.exp(-k / 7)).toFixed(1)}`;
    });
    s += `<path d="${d}L400 118" fill="none" stroke="currentColor" stroke-width="2"/>`;
  } else if (t === "spectrum"){
    for (let i = 0; i < 40; i++){
      const h = 12 + Math.abs(Math.sin(i * 2.1)) * 6 + 70 * Math.exp(-(((i - 14) / 2.2) ** 2)) + 42 * Math.exp(-(((i - 29) / 1.8) ** 2));
      s += `<rect x="${20 + i * 9}" y="${(135 - h).toFixed(1)}" width="7" height="${h.toFixed(1)}" fill="currentColor" fill-opacity=".55"/>`;
    }
    s += '<line x1="10" y1="135" x2="390" y2="135" stroke="currentColor"/>';
  } else if (t === "feynman"){
    s += Ln(40, 25, 150, 75) + Ln(40, 125, 150, 75) + Ln(250, 75, 360, 25) + Ln(250, 75, 360, 125);
    let w = "M150 75"; for (let x = 154; x <= 250; x += 3) w += `L${x} ${(75 + 7 * Math.sin((x - 150) / 4)).toFixed(1)}`;
    s += `<path d="${w}" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="150" cy="75" r="4" fill="currentColor"/><circle cx="250" cy="75" r="4" fill="currentColor"/>`;
    [["e⁻", 18, 22], ["e⁺", 18, 138], ["γ", 195, 55], ["μ⁻", 364, 22], ["μ⁺", 364, 138]]
      .forEach(([tx, x, y]) => s += `<text x="${x}" y="${y}" font-size="15" font-family="monospace" fill="currentColor">${tx}</text>`);
  } else {
    [120, 80, 160, 60, 140, 100, 70, 150].forEach((w, i) =>
      s += `<rect x="${40 + (i % 3) * 22}" y="${18 + i * 15}" width="${w}" height="6" rx="3" fill="currentColor" fill-opacity="${(.35 + (i % 4) * .15).toFixed(2)}"/>`);
    s += '<text x="290" y="105" font-size="72" fill="currentColor" fill-opacity=".25" font-family="monospace">{ }</text>';
  }
  return `<svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${s}</svg>`;
}
const thumb = (tipo, img, alt, badge) =>
  `<div class="thumb">${arte(tipo)}${img ? `<img src="${img}" alt="${esc(alt)}" loading="lazy" onerror="this.remove()">` : ""}${badge ? `<span class="badge">${badge}</span>` : ""}</div>`;

/* ---------- hero: particle collisions (inspired by LHC event displays) ---------- */
(function collider(){
  const cv = $("bg"), g = cv.getContext("2d"), hud = $("evt");
  let W, H, ev = [], last = -1e9, n = 100000 + Math.floor(Math.random() * 800000);
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ W = cv.width = cv.offsetWidth; H = cv.height = cv.offsetHeight; }
  size(); addEventListener("resize", size);
  function spawn(t0){
    const cx = W * (.2 + Math.random() * .6), cy = H * (.2 + Math.random() * .6), tr = [];
    for (let i = 0, k = 8 + Math.floor(Math.random() * 7); i < k; i++){
      const p = Math.random(), curv = (Math.random() < .5 ? -1 : 1) * (.006 + .05 * p * p), N = 30 + Math.floor(90 * (1 - p));
      let x = cx, y = cy, ph = Math.random() * 6.283; const pts = [];
      for (let j = 0; j < N; j++){ pts.push([x, y]); x += Math.cos(ph) * 4; y += Math.sin(ph) * 4; ph += curv; }
      tr.push(pts);
    }
    ev.push({ t0, cx, cy, tr });
    hud.textContent = `event ${String(++n).padStart(6, "0")} · √s = 13.6 TeV · B = 2 T`;
  }
  function frame(){
    const now = performance.now();
    g.clearRect(0, 0, W, H);
    const cs = getComputedStyle(document.documentElement), c1 = cs.getPropertyValue("--accent").trim(), c2 = cs.getPropertyValue("--accent2").trim();
    if (!still && now - last > 2800 && ev.length < 3){ spawn(now); last = now; }
    ev = ev.filter(e => (now - e.t0) / 1000 < 4.4);
    for (const e of ev){
      const age = (now - e.t0) / 1000, fade = age > 3.2 ? Math.max(0, 1 - (age - 3.2) / 1.2) : 1;
      g.lineWidth = 1.6;
      if (age < .6){                      /* two beams approaching the vertex */
        const d = (.6 - age) / .6 * 280;
        g.strokeStyle = g.fillStyle = c1; g.globalAlpha = .8;
        for (const s of [-1, 1]){
          g.beginPath(); g.moveTo(e.cx + s * (d + 90), e.cy); g.lineTo(e.cx + s * d, e.cy); g.stroke();
          g.beginPath(); g.arc(e.cx + s * d, e.cy, 3, 0, 6.3); g.fill();
        }
      } else {
        const f = Math.min(1, (age - .6) / 1.4);
        if (age < .9){ g.globalAlpha = (.9 - age) / .3 * .6; g.fillStyle = c2; g.beginPath(); g.arc(e.cx, e.cy, 6 + (age - .6) * 70, 0, 6.3); g.fill(); }
        e.tr.forEach((pts, i) => {
          const m = Math.max(2, Math.floor(f * pts.length));
          g.strokeStyle = g.fillStyle = i % 3 ? c1 : c2; g.globalAlpha = .55 * fade;
          g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
          for (let j = 1; j < m; j++) g.lineTo(pts[j][0], pts[j][1]);
          g.stroke();
          g.beginPath(); g.arc(pts[m - 1][0], pts[m - 1][1], 2.4, 0, 6.3); g.fill();
        });
      }
    }
    g.globalAlpha = 1;
    if (!still) requestAnimationFrame(frame);
  }
  if (still){ spawn(performance.now() - 2600); }
  frame();
})();

/* ---------- animated terminal ---------- */
let termTok = 0;
async function term(){
  const tok = ++termTok, el = $("term"); el.innerHTML = "";
  for (const [cmd, out] of PERFIL.terminal){
    const line = document.createElement("div");
    line.innerHTML = '<span class="ps">$</span> <span class="cmd"></span>';
    el.appendChild(line);
    const c = line.querySelector(".cmd");
    for (const ch of cmd){ c.textContent += ch; await wait(40); if (tok !== termTok) return; }
    await wait(240); if (tok !== termTok) return;
    const o = document.createElement("div"); o.className = "out"; o.textContent = L(out); el.appendChild(o);
    await wait(360); if (tok !== termTok) return;
  }
  const last = document.createElement("div");
  last.innerHTML = '<span class="ps">$</span> <span class="cursor"></span>'; el.appendChild(last);
}

/* ---------- section renderers ---------- */
let filtro = "all", gh = "loading";
const abiertas = new Set();   /* tarjetas con galería abierta */
function contar(el){
  const meta = +el.dataset.n, t0 = performance.now();
  (function paso(t){
    const p = Math.min((t - t0) / 1400, 1);
    el.textContent = Math.round(meta * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(paso);
  })(t0);
}
function activate(root, anim){
  root.querySelectorAll("[data-n]").forEach(b => anim ? contar(b) : b.textContent = b.dataset.n);
  root.querySelectorAll("[data-w]").forEach(b => b.style.width = b.dataset.w + "%");
}
function nextExt(img){            /* prueba .jpg, .png, .webp, .jpeg antes de rendirse */
  const E = ["jpg", "png", "webp", "jpeg"], i = (+img.dataset.e || 0) + 1;
  if (i >= E.length){ img.remove(); return; }
  img.dataset.e = i; img.src = img.dataset.b + "." + E[i];
}

function aplicarTema(t){ document.documentElement.dataset.theme = t; $("theme").textContent = t === "dark" ? "☀" : "☾"; }
let tema = null; try { tema = localStorage.getItem("tema"); } catch (e) {}
aplicarTema(tema || "dark");
$("theme").onclick = () => {
  const n = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  aplicarTema(n); try { localStorage.setItem("tema", n); } catch (e) {}
};

$("burger").onclick = () => $("links").classList.toggle("open");
$("links").onclick = () => $("links").classList.remove("open");
const io = new IntersectionObserver(es => es.forEach(en => {
  if (!en.isIntersecting) return;
  en.target.classList.add("show"); activate(en.target, true); io.unobserve(en.target);
}), { threshold: 0.15 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
</script>
</body>
</html>
